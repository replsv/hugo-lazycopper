<article class="group relative rounded-xl border border-stone-200 bg-white p-5 transition hover:border-copper-300 hover:shadow-sm sm:p-6 dark:border-teal-800/70 dark:bg-teal-900/30 dark:hover:border-copper-700">
  <h3 class="text-lg font-semibold leading-snug text-teal-800 group-hover:text-copper-600 dark:text-stone-100 dark:group-hover:text-copper-300">
    {{- if .Draft }}<span class="mr-2 rounded bg-copper-100 px-1.5 py-0.5 align-middle text-xs font-medium text-copper-700 dark:bg-copper-900 dark:text-copper-200">{{ i18n "draft" | default "Draft" }}</span>{{ end }}
    {{- .Title -}}
  </h3>
  {{- if not site.Params.hideSummary }}
  <p class="justified mt-2 line-clamp-3 text-[0.95rem] leading-relaxed text-stone-600 dark:text-stone-300">
    {{- or .Description (.Summary | plainify | htmlUnescape) -}}
  </p>
  {{- end }}
  <div class="mt-4 text-sm text-stone-500 dark:text-stone-400">{{ partial "post_meta.html" . }}</div>
  <a href="{{ .RelPermalink }}" class="absolute inset-0 rounded-xl" aria-label="{{ .Title | plainify }}"></a>
</article>
