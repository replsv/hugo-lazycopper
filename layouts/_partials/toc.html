{{- $show := .Params.ShowToc | default site.Params.ShowToc }}
{{- if and $show (gt .WordCount 400) }}
  {{- with .TableOfContents }}
    {{- if ne . `<nav id="TableOfContents"></nav>` }}
<details class="mb-10 rounded-lg border border-stone-200 bg-white px-5 py-3 text-sm dark:border-teal-800 dark:bg-teal-900/30"{{ if ($.Params.TocOpen | default site.Params.TocOpen) }} open{{ end }}>
  <summary class="cursor-pointer font-medium text-teal-800 select-none dark:text-stone-100">{{ i18n "toc" | default "Table of contents" }}</summary>
  <div class="mt-3 text-stone-600 dark:text-stone-300 [&_a:hover]:text-copper-600 dark:[&_a:hover]:text-copper-300 [&_li]:my-1 [&_ul_ul]:ml-4 [&_ul_ul]:mt-1">{{ . }}</div>
</details>
    {{- end }}
  {{- end }}
{{- end }}
