{{- define "main" }}
<header class="mb-8">
  <h1 class="text-3xl font-semibold tracking-tight text-teal-800 dark:text-stone-100">{{ .Title }}</h1>
</header>
<div class="relative">
  <span class="pointer-events-none absolute top-1/2 left-4 -translate-y-1/2 text-stone-400">{{ partial "icon.html" (dict "name" "search" "class" "size-5") }}</span>
  <input id="search-input" type="search" autocomplete="off" autofocus
         placeholder="{{ .Params.placeholder | default (i18n "search_placeholder" | default "Search posts…") }}"
         aria-label="{{ i18n "search" | default "Search" }}"
         class="w-full rounded-lg border border-stone-300 bg-white py-3 pr-4 pl-12 text-stone-900 placeholder:text-stone-400 focus:border-copper-400 focus:ring-2 focus:ring-copper-200 focus:outline-none dark:border-teal-700 dark:bg-teal-900/40 dark:text-stone-100 dark:focus:ring-copper-900">
</div>
<p id="search-status" class="mt-3 min-h-5 text-sm text-stone-500 dark:text-stone-400" aria-live="polite"></p>
<div id="search-results" class="mt-4 space-y-3"
     data-index="{{ with site.Home.OutputFormats.Get "json" }}{{ .RelPermalink }}{{ end }}"
     data-none="{{ i18n "search_none" | default "No results." }}"
     data-count="{{ i18n "search_count" | default "%d result(s)" }}"
     data-error="{{ i18n "search_error" | default "Search index could not be loaded." }}"></div>
{{- $js := resources.Get "js/search.js" | js.Build (dict "minify" (not hugo.IsDevelopment)) }}
{{- if hugo.IsProduction }}{{ $js = $js | fingerprint }}{{ end }}
<script src="{{ $js.RelPermalink }}" defer></script>
{{- end }}
