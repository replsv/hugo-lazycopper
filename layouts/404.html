{{- define "main" }}
<div class="py-16 text-center">
  <p class="text-7xl font-semibold text-copper-500">404</p>
  <h1 class="mt-4 text-2xl font-semibold text-teal-800 dark:text-stone-100">{{ i18n "404_title" | default "Page not found" }}</h1>
  <p class="mt-2 text-stone-600 dark:text-stone-300">{{ i18n "404_text" | default "The page you're looking for doesn't exist or has moved." }}</p>
  <a href="{{ site.Home.RelPermalink }}" class="mt-8 inline-flex items-center gap-2 rounded-md bg-teal-700 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-copper-600 dark:bg-teal-600 dark:hover:bg-copper-600">
    {{ partial "icon.html" (dict "name" "arrow-left" "class" "size-4") }}{{ i18n "home" | default "Home" }}
  </a>
</div>
{{- end }}
